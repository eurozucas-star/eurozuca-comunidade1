# Compila a app Eurozuca (Android e iOS) no GitHub.
# Android: gera um APK de teste e, se os segredos de assinatura existirem, um AAB pronto para a Google Play.
# iOS: compila para o simulador para confirmar que o projeto está correto (publicar exige conta Apple Developer).
name: App mobile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/app-mobile.yml']

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: APK de teste
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: eurozuca-android-teste
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: AAB assinado para a Google Play
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          EZ_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EZ_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EZ_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/eurozuca-release.jks
          cd android && ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('mobile/android/app/build/outputs/bundle/release/*.aab') != '' }}
        with:
          name: eurozuca-android-google-play
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab

  ios:
    runs-on: macos-15
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx cap sync ios
      - name: Compilar para o simulador (sem assinatura)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -20
